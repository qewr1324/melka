<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Melka Editor</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <header class="app-header">
        <div class="header-title">
            <span class="logo">🏠</span>
            <span class="title">Melka</span>
        </div>
        <div class="header-actions">
            <button id="undoBtn" title="برگرداندن">↶</button>
            <button id="redoBtn" title="تکرار">↷</button>
        </div>
    </header>

    <main class="app-main">
        <section class="upload-bar">
            <input type="file" id="fileInput" accept="image/*" hidden />
            <label for="fileInput" class="upload-label">
                <span>📤</span> آپلود پلان
            </label>
            <button id="detectBtn" disabled>
                <span>🤖</span> تشخیص
            </button>
            <span id="uploadStatus"></span>
        </section>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="canvas"></canvas>

            <!-- ⭐ input نامرئی برای گرفتن کیبورد -->
            <input id="textInput" class="text-input" type="text" autocomplete="off" autocorrect="off"
                autocapitalize="off" spellcheck="false" />

            <div class="zoom-indicator" id="zoomIndicator">100%</div>

            <div class="tool-hint" id="toolHint">👆 روی متن بزن تا انتخاب بشه</div>

            <div class="floating-zoom">
                <button id="zoomIn">+</button>
                <button id="zoomOut">−</button>
                <button id="zoomFit">🎯</button>
            </div>
        </div>

        <nav class="bottom-toolbar">
            <button class="tool-btn active" data-tool="select">
                <span>👆</span>
                <small>انتخاب</small>
            </button>
            <button class="tool-btn" data-tool="text">
                <span>🏷️</span>
                <small>متن</small>
            </button>
            <button class="tool-btn" data-tool="eraser">
                <span>🗑️</span>
                <small>حذف</small>
            </button>
        </nav>

        <div class="prop-sheet" id="propSheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <span id="selectionInfo">هیچ‌چیز انتخاب نشده</span>
                <button id="closePropSheet" class="close-btn">✖</button>
            </div>
            <div class="sheet-body">
                <div class="prop-row" id="widthRow">
                    <div class="prop-label">
                        <span>ضخامت</span>
                        <span class="prop-value" id="widthValue">3</span>
                    </div>
                    <input type="range" id="propWidth" min="1" max="15" value="3" step="1" />
                </div>

                <div class="prop-row" id="fontRow">
                    <div class="prop-label">
                        <span>اندازه متن</span>
                        <span class="prop-value" id="fontValue">24</span>
                    </div>
                    <input type="range" id="propFontSize" min="10" max="80" value="24" step="2" />
                </div>

                <button id="editTextBtn" class="sheet-action">✏️ ویرایش متن</button>

                <div class="prop-row" id="colorRow">
                    <div class="prop-label"><span>رنگ</span></div>
                    <input type="color" id="propColor" value="#2c3e50" />
                </div>

                <button id="deleteBtn" class="sheet-action danger">🗑️ حذف</button>
            </div>
        </div>

        <section class="settings-bar">
            <select id="styleSelect">
                <option value="modern">مدرن</option>
                <option value="blueprint">آبی</option>
                <option value="minimal">مینیمال</option>
            </select>
            <select id="compassDirection">
                <option value="north">N شمال</option>
                <option value="south">S جنوب</option>
                <option value="east">E شرق</option>
                <option value="west">W غرب</option>
            </select>
            <button id="reRender" class="primary">🎨 رندر</button>
        </section>
    </main>

    <section class="rendered-overlay" id="renderedPlan" style="display:none;"></section>

    <script src="/static/script.js"></script>
</body>

</html>
